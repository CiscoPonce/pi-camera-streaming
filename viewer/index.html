<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="author" content="CiscoPonce" />
  <title>Pi Camera Viewer</title>
  <style>
    :root { 
      color-scheme: dark; 
    }
    
    body { 
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; 
      margin: 0; 
      padding: 16px; 
      background: #0b0f14; 
      color: #e6ebf0; 
    }

    h1 { 
      margin: 0 0 8px; 
      font-weight: 600; 
      color: #ffffff;
    }
    
    h2 { 
      margin: 0 0 12px; 
      font-weight: 600; 
      color: #e6ebf0;
    }
    
    .subtitle {
      color: #8b949e;
      font-size: 14px;
      margin-bottom: 20px;
    }
    
    .video-container {
      position: relative;
      width: 100%;
      max-width: 960px;
      margin-bottom: 16px;
    }

    video { 
      width: 100%; 
      display: block;
      background: #000; 
      border-radius: 8px; 
      border: 1px solid #2a3644; 
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    
    .status {
      margin-top: 16px;
      padding: 12px;
      background: #161b22;
      border-radius: 6px;
      border: 1px solid #30363d;
      font-family: monospace;
      font-size: 14px;
    }
    
    .status.connected {
      border-color: #238636;
      background: #0d1117;
    }
    
    .status.error {
      border-color: #da3633;
      background: #0d1117;
    }
    
    .controls {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    
    button {
      padding: 8px 16px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6ebf0;
      cursor: pointer;
      font-size: 14px;
    }
    
    button:hover {
      background: #30363d;
      border-color: #8b949e;
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .info {
      margin-top: 20px;
      padding: 16px;
      background: #0d1117;
      border-radius: 6px;
      border: 1px solid #21262d;
    }
    
    .info h3 {
      margin: 0 0 8px;
      color: #e6ebf0;
    }
    
    .info p {
      margin: 4px 0;
      color: #8b949e;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Pi Camera Viewer</h1>
  <p class="subtitle">Raspberry Pi 5 Camera Module 3 Live Stream</p>
  
  <div class="video-container">
    <video id="player" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>
  </div>
  
  <div class="ai-controls" style="margin-top: 16px; padding: 12px; background: #1c2128; border-radius: 6px; border: 1px solid #444c56; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 10px;">
        <input type="checkbox" id="yolo-toggle">
        <label for="yolo-toggle" style="font-weight: 500; cursor: pointer; color: #79c0ff;">Enable YOLO26 Object Detection (Live Overlay)</label>
        <button id="yolo-debug-btn" style="padding: 2px 8px; font-size: 10px;">Force Connect</button>
    </div>
    <div id="yolo-status" style="font-size: 12px; color: #8b949e; font-family: monospace;">YOLO Status: Not enabled</div>
  </div>
  
  <div id="status" class="status">
    Connecting to stream...
  </div>
  
  <div class="controls">
    <button id="reconnect">Reconnect</button>
    <button id="toggle-mute">Unmute</button>
    <button id="fullscreen">Fullscreen</button>
  </div>
  
  <div class="info">
    <h3>Stream Information</h3>
    <p><strong>Protocol:</strong> <span id="protocol">WebRTC (primary), FLV (fallback)</span></p>
    <p><strong>Resolution:</strong> <span id="resolution">1280×720</span></p>
    <p><strong>Framerate:</strong> <span id="framerate">30 fps</span></p>
    <p><strong>Latency:</strong> <span id="latency">~200-500ms</span></p>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/flv.js@latest/dist/flv.min.js"></script>
  <script src="srs.player.js"></script>
  <script>
    // Enhanced viewer functionality
    let isMuted = true;
    
    const player = document.getElementById('player');
    const status = document.getElementById('status');
    const reconnectBtn = document.getElementById('reconnect');
    const muteBtn = document.getElementById('toggle-mute');
    const fullscreenBtn = document.getElementById('fullscreen');
    
    function updateStatus(message, type = 'info') {
      status.textContent = message;
      status.className = `status ${type}`;
    }
    
    function setPlayer(playerInstance) {
      currentPlayer = playerInstance;
    }
    
    function toggleMute() {
      isMuted = !isMuted;
      player.muted = isMuted;
      muteBtn.textContent = isMuted ? 'Unmute' : 'Mute';
    }
    
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        player.requestFullscreen().catch(err => {
          console.error('Error attempting to enable fullscreen:', err);
        });
      } else {
        document.exitFullscreen();
      }
    }
    
    // Event listeners
    reconnectBtn.addEventListener('click', () => {
      updateStatus('Reconnecting...', 'info');
      location.reload();
    });
    
    muteBtn.addEventListener('click', toggleMute);
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    
    // Player event listeners
    player.addEventListener('loadstart', () => {
      updateStatus('Loading stream...', 'info');
    });
    
    player.addEventListener('canplay', () => {
      updateStatus('Stream connected successfully', 'connected');
    });
    
    player.addEventListener('error', (e) => {
      updateStatus(`Stream error: ${e.message || 'Unknown error'}`, 'error');
    });
    
    player.addEventListener('waiting', () => {
      updateStatus('Buffering...', 'info');
    });
    
    player.addEventListener('playing', () => {
      updateStatus('Stream playing', 'connected');
    });
    
    // Fullscreen change handler
    document.addEventListener('fullscreenchange', () => {
      fullscreenBtn.textContent = document.fullscreenElement ? 'Exit Fullscreen' : 'Fullscreen';
    });
    
    // Initialize
    updateStatus('Initializing player...', 'info');

    // YOLO Integration
    const yoloToggle = document.getElementById('yolo-toggle');
    const yoloStatus = document.getElementById('yolo-status');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    let yoloSocket = null;

    function updateYoloStatus(msg, color = '#8b949e') {
        yoloStatus.textContent = `YOLO Status: ${msg}`;
        yoloStatus.style.color = color;
    }

    function resizeOverlay() {
      overlay.width = player.clientWidth;
      overlay.height = player.clientHeight;
    }

    window.addEventListener('resize', resizeOverlay);
    player.addEventListener('loadedmetadata', resizeOverlay);
    player.addEventListener('play', () => {
        setTimeout(resizeOverlay, 500);
    });

    yoloToggle.addEventListener('change', () => {
      console.log('YOLO Toggle changed:', yoloToggle.checked);
      if (yoloToggle.checked) {
        startYOLO();
      } else {
        stopYOLO();
      }
    });

    document.getElementById('yolo-debug-btn').addEventListener('click', () => {
        console.log('Force Connect clicked');
        yoloToggle.checked = true;
        startYOLO();
    });

    function startYOLO() {
      const hostname = window.location.hostname || '192.168.1.231';
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${hostname}:8765`;
      
      console.log('Connecting to YOLO at:', wsUrl);
      updateYoloStatus(`Connecting to ${wsUrl}...`, '#79c0ff');
      
      try {
          yoloSocket = new WebSocket(wsUrl);

          yoloSocket.onopen = () => {
            console.log('YOLO WebSocket Connected');
            updateYoloStatus('Connected & Running', '#39ff14');
            resizeOverlay();
          };

          yoloSocket.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                drawBoxes(data.boxes);
                if (data.boxes.length > 0) {
                    updateYoloStatus(`Connected - Detecting ${data.boxes.length} objects`, '#39ff14');
                } else {
                    updateYoloStatus('Connected - No objects detected', '#39ff14');
                }
            } catch (e) {
                console.error('Error parsing YOLO data:', e);
            }
          };

          yoloSocket.onclose = (event) => {
            console.log('YOLO WebSocket Closed:', event.code, event.reason);
            ctx.clearRect(0, 0, overlay.width, overlay.height);
            if (yoloToggle.checked) {
              updateYoloStatus(`Disconnected (Code: ${event.code}). Retrying...`, '#da3633');
              setTimeout(() => {
                  if (yoloToggle.checked) startYOLO();
              }, 3000);
            } else {
              updateYoloStatus('Disabled');
            }
          };

          yoloSocket.onerror = (err) => {
            console.error('YOLO WebSocket error observed');
            updateYoloStatus('Connection failed. Is port 8765 open?', '#da3633');
          };
      } catch (e) {
          console.error('WebSocket creation error:', e);
          updateYoloStatus(`Setup error: ${e.message}`, '#da3633');
      }
    }

    function stopYOLO() {
      if (yoloSocket) {
        yoloSocket.close();
        yoloSocket = null;
      }
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      updateYoloStatus('Disabled');
    }

    function drawBoxes(boxes) {
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      
      if (!boxes || boxes.length === 0) return;

      ctx.strokeStyle = '#39ff14'; // Neon Green
      ctx.lineWidth = 3;
      ctx.font = 'bold 16px monospace';
      
      boxes.forEach(item => {
        const [x1, y1, x2, y2] = item.box;
        const left = x1 * overlay.width;
        const top = y1 * overlay.height;
        const width = (x2 - x1) * overlay.width;
        const height = (y2 - y1) * overlay.height;

        // Draw Box
        ctx.strokeRect(left, top, width, height);
        
        // Draw Label Background
        const label = `${item.label} ${Math.round(item.conf * 100)}%`;
        const textWidth = ctx.measureText(label).width;
        ctx.fillStyle = 'rgba(57, 255, 20, 0.8)';
        ctx.fillRect(left, top > 25 ? top - 25 : top, textWidth + 10, 25);
        
        // Draw Label Text
        ctx.fillStyle = '#000000';
        ctx.fillText(label, left + 5, top > 25 ? top - 7 : top + 18);
      });
    }
  </script>
</body>
</html>
